name: Android — tests et APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du cœur (JSON, validation, export, import)
        run: ./gradlew :core:test --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérification des scripts générés (TypeScript contre l'API officielle @minecraft/server)
        run: |
          cd core/build/scripts-check
          for versions in "2.8.0 2.1.0" "2.9.0 2.1.0" "2.10.0 2.2.0"; do
            set -- $versions
            rm -rf node_modules package.json package-lock.json
            npm init -y > /dev/null
            npm install --no-audit --no-fund typescript@5 "@minecraft/server@$1" "@minecraft/server-ui@$2"
            npx tsc -p .
            echo "Scripts valides pour @minecraft/server $1"
          done

      - name: Tests de l'interface (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Analyse Android Lint
        run: ./gradlew :app:lintDebug

      - name: Construction de l'APK
        run: ./gradlew :app:assembleDebug

      - name: Renommer l'APK
        run: |
          mkdir -p livraison
          cp app/build/outputs/apk/debug/app-debug.apk "livraison/BedrockModStudio-${GITHUB_SHA::7}.apk"
          cp core/build/exemples/*.mcaddon livraison/ || true

      - name: Publier l'APK (onglet Actions → ce run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BedrockModStudio-APK
          path: livraison/
          retention-days: 30

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
