name: Android — tests et APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du cœur (JSON, validation, export, import)
        run: ./gradlew :core:test --stacktrace

      - name: Tests de l'interface (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Analyse Android Lint
        run: ./gradlew :app:lintDebug

      - name: Construction de l'APK
        run: ./gradlew :app:assembleDebug

      - name: Renommer l'APK
        run: |
          mkdir -p livraison
          cp app/build/outputs/apk/debug/app-debug.apk "livraison/BedrockModStudio-${GITHUB_SHA::7}.apk"
          cp core/build/exemples/*.mcaddon livraison/ || true

      - name: Publier l'APK (onglet Actions → ce run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BedrockModStudio-APK
          path: livraison/
          retention-days: 30

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
