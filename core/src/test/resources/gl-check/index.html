<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc d'essai du moteur 3D</title>
<style>
  body { background: #111; color: #ddd; font: 14px sans-serif; margin: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; } figcaption { padding: 4px 0; }
  #log { white-space: pre-wrap; color: #f88; }
</style>
<script src="data.js"></script>
</head>
<body>
<h1>Moteur 3D GPU — banc d'essai WebGL 2</h1>
<p>Mêmes shaders (GLSL ES 3.00) et mêmes matrices que l'application Android. Ce fichier reproduit le rendu de <code>GlSceneRenderer</code>.</p>
<div id="log"></div>
<div class="grid" id="grid"></div>
<script>
window.RESULT = { errors: [], done: false };
function fail(msg) { window.RESULT.errors.push(msg); document.getElementById('log').textContent += msg + '\n'; }
const [W, H] = window.SIZE;
const STRIDE = 15, SHADOW = 2048;

function program(gl, name) {
  const src = window.SHADERS[name];
  function sh(type, text) {
    const s = gl.createShader(type); gl.shaderSource(s, text); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(name + ' : ' + gl.getShaderInfoLog(s));
    return s;
  }
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, src.vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, src.fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail(name + ' (liaison) : ' + gl.getProgramInfoLog(p));
  p.u = n => gl.getUniformLocation(p, n);
  return p;
}

function loadImage(b64) {
  return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'data:image/png;base64,' + b64; });
}

async function renderScene(sc) {
  const fig = document.createElement('figure');
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const cap = document.createElement('figcaption'); cap.textContent = sc.title;
  fig.appendChild(canvas); fig.appendChild(cap); document.getElementById('grid').appendChild(fig);
  const gl = canvas.getContext('webgl2', { antialias: true, preserveDrawingBuffer: true });
  if (!gl) { fail('WebGL 2 indisponible'); return; }
  const P = { model: program(gl, 'model'), ground: program(gl, 'ground'), sky: program(gl, 'sky'), depth: program(gl, 'depth') };

  const meshes = {};
  for (const key of ['MOB', 'WORLD']) {
    const src = window[key];
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(src.v), gl.STATIC_DRAW);
    const at = (i, n, off) => { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, n, gl.FLOAT, false, STRIDE * 4, off * 4); };
    at(0, 3, 0); at(1, 3, 3); at(2, 2, 6); at(3, 4, 8); at(4, 3, 12);
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, await loadImage(src.png));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    meshes[key] = { vao, count: src.v.length / STRIDE, tex };
  }
  const shadowTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, SHADOW, SHADOW, 0, gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('Carte d\'ombre incomplète');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // Ombres.
  if (sc.shadows) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, SHADOW, SHADOW);
    gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST); gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 4);
    gl.useProgram(P.depth); gl.uniformMatrix4fv(P.depth.u('uLightVP'), false, sc.light); gl.uniform1i(P.depth.u('uTex'), 0);
    for (const o of sc.objects) {
      const m = meshes[o.mesh];
      gl.uniformMatrix4fv(P.depth.u('uModel'), false, o.model); gl.uniform1f(P.depth.u('uHasTex'), 1);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, m.tex);
      gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES, 0, m.count);
    }
    gl.disable(gl.POLYGON_OFFSET_FILL); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  gl.viewport(0, 0, W, H);
  const e = sc.env;
  gl.clearColor(e.skyHorizon[0], e.skyHorizon[1], e.skyHorizon[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  // Ciel.
  gl.disable(gl.DEPTH_TEST); gl.useProgram(P.sky);
  gl.uniformMatrix4fv(P.sky.u('uInvViewProj'), false, sc.invVP); gl.uniform3fv(P.sky.u('uEye'), sc.eye);
  gl.uniform3fv(P.sky.u('uSkyTop'), e.skyTop); gl.uniform3fv(P.sky.u('uSkyHorizon'), e.skyHorizon); gl.uniform3fv(P.sky.u('uSkyBottom'), e.skyBottom);
  gl.uniform3fv(P.sky.u('uSunDir'), sc.sun); gl.uniform3fv(P.sky.u('uSunColor'), e.sunColor);
  gl.uniform1f(P.sky.u('uStars'), e.stars); gl.uniform1f(P.sky.u('uSunDisc'), e.sunDisc);
  gl.bindVertexArray(gl.createVertexArray()); gl.drawArrays(gl.TRIANGLES, 0, 3);

  function lighting(p) {
    gl.uniformMatrix4fv(p.u('uView'), false, sc.view); gl.uniformMatrix4fv(p.u('uProj'), false, sc.proj); gl.uniformMatrix4fv(p.u('uLightVP'), false, sc.light);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(p.u('uShadow'), 1); gl.activeTexture(gl.TEXTURE0);
    gl.uniform1f(p.u('uShadowOn'), sc.shadows); gl.uniform3fv(p.u('uSunDir'), sc.sun); gl.uniform3fv(p.u('uSunColor'), e.sunColor);
    gl.uniform3fv(p.u('uAmbSky'), e.ambSky); gl.uniform3fv(p.u('uAmbGround'), e.ambGround); gl.uniform3fv(p.u('uFog'), e.fog);
    gl.uniform2f(p.u('uFogRange'), sc.fog[0], sc.fog[1]); gl.uniform3fv(p.u('uEye'), sc.eye);
  }
  // Sol.
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  const c = sc.center, r = sc.groundR, y = sc.groundY;
  const gv = new Float32Array([c[0]-r,y,c[2]-r, c[0]+r,y,c[2]-r, c[0]+r,y,c[2]+r, c[0]-r,y,c[2]-r, c[0]+r,y,c[2]+r, c[0]-r,y,c[2]+r]);
  const gvao = gl.createVertexArray(); gl.bindVertexArray(gvao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, gv, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P.ground); lighting(P.ground);
  gl.uniform3fv(P.ground.u('uGround'), e.ground); gl.uniform3fv(P.ground.u('uGrid'), e.grid);
  gl.uniform3fv(P.ground.u('uCenter'), sc.center); gl.uniform1f(P.ground.u('uRadius'), r);
  gl.drawArrays(gl.TRIANGLES, 0, 6); gl.disable(gl.BLEND);
  // Modèles.
  const xray = sc.mode === 4;
  if (xray) { gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.depthMask(false); }
  gl.useProgram(P.model); lighting(P.model);
  gl.uniform1i(P.model.u('uTex'), 0); gl.uniform1i(P.model.u('uMode'), sc.mode); gl.uniform1f(P.model.u('uTime'), 0.3); gl.uniform1f(P.model.u('uAlpha'), 1);
  for (const o of sc.objects) {
    const m = meshes[o.mesh];
    gl.uniformMatrix4fv(P.model.u('uModel'), false, o.model); gl.uniform1f(P.model.u('uHasTex'), 1);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, m.tex);
    gl.bindVertexArray(m.vao); gl.drawArrays(gl.TRIANGLES, 0, m.count);
  }
  if (xray) { gl.depthMask(true); gl.disable(gl.BLEND); }
  const err = gl.getError(); if (err !== gl.NO_ERROR) fail(sc.title + ' : erreur GL ' + err);
}

(async () => {
  try { for (const sc of window.SCENES) await renderScene(sc); } catch (e) { fail(String(e && e.stack || e)); }
  window.RESULT.done = true;
})();
</script>
</body>
</html>
